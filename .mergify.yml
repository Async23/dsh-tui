# Mergify 合并队列——`main` 的合并由它执行。
#
# 为什么需要队列：`main` 的 ruleset 要求「分支必须最新」（strict），两个 PR
# 各自绿了也会互相顶掉，现在靠人工 update-branch → 等 CI → 点合并。队列把
# 这条流水线自动化：更新到最新 main → 在临时 PR 上重跑 CI → 合并。
#
# 公开仓库走 Mergify 的 Open Source 档（$0，含 Merge Queue）。两条车道互斥，
# 由 `merge-queue` 标签分流：
#
#   approved —— 拿到 1 个 approving review 即自动入队。合并条件由 base 分支上
#               的 ruleset 自动注入（批准、ci-gate、评论已解决、批准最后一次
#               推送），与手动合并同一把尺。
#   manual   —— 维护者打 `merge-queue` 标签即入队，不校验 GitHub 的批准要求，
#               等价于 `gh pr merge --admin`。
#
# 两条车道都只收 base = main，且都躲开 `on hold`。

merge_protections_settings:
  # 自动入队。`#` 开头的条件在 YAML 里必须加引号，否则会被当成注释。
  # 生效前提：在 Mergify dashboard 里为这个仓库打开 Merge Protections。
  auto_merge_conditions:
    - or:
        - label = merge-queue
        - "#approved-reviews-by >= 1"

merge_queue:
  # 一次只跑一条：CI 重（build + 四个回归组 + platform smoke），串行最省、
  # 也最接近现在的人工合并节奏。想提速再抬 max_parallel_checks。
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: approved
    merge_method: squash # 与仓库既有习惯一致：一个 PR 一个提交
    batch_size: 1 # 不做批量合并（batch_size > 1 是付费档能力，这里也不需要）
    # 顺带把队列 CI 固定成「临时 PR」而不是 in-place：in-place 会挡掉
    # dependabot 与改动 workflow 的 fork PR。
    max_checks_retries: 1 # 队列里 CI 红一次先自动重跑（0 = 关闭）
    queue_conditions:
      - base = main
      - -draft
      - -conflict
      - check-success = ci-gate # PR 自己先绿，再排进队列
      - label != merge-queue
      - label != on hold
    merge_conditions:
      # ruleset 注入的批准 / 评论已解决 / 批准最后一次推送会叠加在这里；
      # 显式写一遍 ci-gate，是为了「CI 绿」不依赖注入的实现细节。
      - check-success = ci-gate

  - name: manual
    merge_method: squash
    batch_size: 1
    max_checks_retries: 1
    # 这条车道的放行信号是维护者的标签，不是 GitHub 的批准，所以不注入
    # ruleset 条件；少了注入就得自己把该守的补上（见 merge_conditions）。
    branch_protection_injection_mode: none
    # 以维护者身份合并（该账号需登录过 dashboard 一次），等价于 --admin。
    merge_bot_account: ccch1mneyyy
    queue_conditions:
      - base = main
      - -draft
      - -conflict
      - label = merge-queue
      - label != on hold
    merge_conditions:
      - check-success = ci-gate
      - "#review-threads-unresolved = 0"
      - "#changes-requested-reviews-by = 0"

pull_request_rules:
  - name: 合并后摘掉手动放行标签
    conditions:
      - merged
      - label = merge-queue
    actions:
      label:
        remove:
          - merge-queue
