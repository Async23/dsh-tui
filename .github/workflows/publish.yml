name: Publish personal release

on:
  push:
    tags: ['v*-async23.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Async23/dsh-tui'
    runs-on: ubuntu-latest
    env:
      DSH_TUI_LANG: zh
      DSH_TUI_THEME: dark
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm verify:release
      - run: node --import tsx/esm scripts/verify-auto-recap.tsx
      - run: pnpm release:pack
      - name: Publish assets from the tagged source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"
          gh release create "$RELEASE_TAG" dist-release/dsh-tui.tgz dist-release/install.mjs dist-release/SHA256SUMS --verify-tag --latest --title "dsh-TUI $version" --notes-file docs/releases/current.md
